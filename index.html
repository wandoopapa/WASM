<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>가족 채팅 게이트웨이</title>
<style>
:root {
  --bg: #0b0e14;
  --panel: #12161f;
  --panel2: #1a2030;
  --line: #232b3d;
  --text: #e8ecf4;
  --muted: #8b94a7;
  --accent: #2f7bff;
  --accent-d: #1f5fd6;
  --mine: #2f7bff;
  --theirs: #1c2333;
  --radius: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
  font-size: 15px; line-height: 1.45;
}
.wrap { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.scr { display: none; flex: 1; flex-direction: column; min-height: 100%; }
.scr.on { display: flex; }
.center { margin: auto; text-align: center; padding: 48px 28px; }
.center h1 { font-size: 22px; margin: 0 0 10px; }
.center p { color: var(--muted); font-size: 14px; margin: 6px 0; }
.stat { color: var(--muted); font-size: 13px; margin-top: 14px; min-height: 20px; }
button { font-family: inherit; cursor: pointer; border: 0; }
.btn {
  background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
  padding: 14px 34px; border-radius: 999px; margin-top: 18px;
  box-shadow: 0 4px 18px rgba(47,123,255,.35);
}
.btn:active { background: var(--accent-d); transform: scale(.98); }
.btn.ghost { background: var(--panel2); color: var(--text); box-shadow: none; padding: 10px 18px; font-size: 14px; }
a.login { color: #7aa8ff; }
/* ---- 채팅 헤더 ---- */
header {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px calc(10px + env(safe-area-inset-top)) ;
  padding-top: calc(12px + env(safe-area-inset-top));
  background: rgba(11,14,20,.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.dot { width: 10px; height: 10px; border-radius: 50%; background: #35d07f; box-shadow: 0 0 8px #35d07f; flex-shrink: 0; }
#whoami { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbtn {
  background: var(--panel2); color: var(--text); border-radius: 999px;
  padding: 8px 14px; font-size: 13px; flex-shrink: 0;
}
.hbtn:active { opacity: .7; }
/* ---- 방 탭 ---- */
#tabs {
  display: flex; gap: 8px; padding: 10px 14px;
  overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--line);
}
#tabs::-webkit-scrollbar { display: none; }
#tabs button {
  background: var(--panel2); color: var(--muted); border-radius: 999px;
  padding: 9px 16px; font-size: 14px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
}
#tabs button.sel { background: var(--accent); color: #fff; }
/* ---- 메시지 ---- */
#msgs { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 4px; }
.m { display: flex; flex-direction: column; max-width: 82%; align-self: flex-start; }
.m.mine { align-self: flex-end; align-items: flex-end; }
.who { font-size: 12px; color: var(--muted); margin: 8px 4px 3px; }
.m.mine .who { display: none; }
.b {
  background: var(--theirs); border-radius: 4px var(--radius) var(--radius) var(--radius);
  padding: 10px 13px; font-size: 15px; overflow-wrap: anywhere; line-height: 1.5;
}
.m.mine .b { background: var(--mine); color: #fff; border-radius: var(--radius) 4px var(--radius) var(--radius); }
.b .t { display: block; font-size: 11px; color: var(--muted); margin-top: 6px; text-align: right; }
.m.mine .b .t { color: rgba(255,255,255,.75); }
.b img, .b video {
  display: block; max-width: 100%; border-radius: 10px; margin: 2px 0;
}
.b img { max-height: 320px; object-fit: cover; cursor: zoom-in; }
.b video { max-height: 300px; background: #000; }
.b img.loading {
  min-height: 140px; min-width: 180px;
  background: linear-gradient(100deg, var(--panel2) 40%, #242e45 50%, var(--panel2) 60%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.b img.media-err { min-height: 0; padding: 24px; cursor: pointer; }
.b video.loading { min-height: 180px; background: #000; }
.vprog { font-size: 13px; color: var(--muted); text-align: center; padding: 10px 4px; }
/* ---- 입력창 ---- */
.composer {
  position: sticky; bottom: 0; z-index: 5;
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
  background: rgba(11,14,20,.94); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.crow { display: flex; gap: 8px; align-items: flex-end; }
#txt {
  flex: 1; min-width: 0; background: var(--panel2); color: var(--text);
  border: 1px solid var(--line); border-radius: 22px;
  padding: 11px 16px; font-size: 15px; font-family: inherit;
  outline: none; resize: none;
}
#txt:focus { border-color: var(--accent); }
.ibtn {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
  background: var(--panel2); font-size: 20px;
  display: flex; align-items: center; justify-content: center;
}
.ibtn:active { opacity: .7; }
#btn-send {
  height: 44px; padding: 0 18px; border-radius: 22px; flex-shrink: 0;
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
  white-space: nowrap;
}
#btn-send:active { background: var(--accent-d); }
#btn-send:disabled { opacity: .5; }
#chatstat { font-size: 12px; color: var(--muted); padding: 6px 4px 0; }
.spin {
  width: 42px; height: 42px; margin: 0 auto 6px; border-radius: 50%;
  border: 3px solid var(--line); border-top-color: var(--accent);
  animation: sp 0.9s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">

  <div id="scr-load" class="scr on">
    <div class="center">
      <div class="spin"></div>
      <h1>게이트웨이 시작 중</h1>
      <p>Tailscale WASM 노드를 브라우저에 띄우고 있습니다.</p>
      <div class="stat" id="loadstat">준비 중…</div>
    </div>
  </div>

  <div id="scr-login" class="scr">
    <div class="center">
      <h1>🔐 Tailscale 로그인</h1>
      <p>이 브라우저 탭이 테일넷의 1회성 ephemeral 노드가 됩니다.<br>탭을 닫으면 노드는 테일넷에서 사라집니다.</p>
      <button class="btn" id="btn-login">Tailscale 로그인</button>
      <div class="stat" id="loginstat">대기 중</div>
      <div class="stat" id="loginlink"></div>
    </div>
  </div>

  <div id="scr-chat" class="scr">
    <header>
      <span class="dot"></span>
      <span id="whoami"></span>
      <button class="hbtn" id="btn-reload">⟳</button>
      <button class="hbtn" id="btn-logout">로그아웃</button>
    </header>
    <div id="tabs"></div>
    <div id="msgs"></div>
    <div class="composer">
      <div class="crow">
        <input id="txt" placeholder="메시지 입력" autocomplete="off">
        <button class="ibtn" id="btn-photo" title="사진">📷</button>
        <button class="ibtn" id="btn-video" title="동영상">🎬</button>
        <button id="btn-send">전송</button>
      </div>
      <div id="chatstat"></div>
    </div>
  </div>

</div>
<input type="file" id="file-photo" accept="image/*" multiple hidden>
<input type="file" id="file-video" accept="video/*" hidden>
<script src="wasm_exec.js"></script>
<script src="app.js?v=9"></script>
</body>
</html>
