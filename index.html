<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WASM 게이트웨이 — 가족앱 채팅</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Malgun Gothic", sans-serif; background: #101418; color: #e8ecf1; }
  .scr { display: none; min-height: 100vh; padding: 24px 16px; max-width: 640px; margin: 0 auto; }
  .scr.on { display: block; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  p.sub { color: #9aa4b2; font-size: 14px; line-height: 1.6; }
  .card { background: #1a212b; border: 1px solid #2a3442; border-radius: 12px; padding: 16px; margin: 12px 0; }
  button { font-size: 16px; padding: 12px 18px; border: 0; border-radius: 10px; background: #2f81f7; color: #fff; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: #2a3442; }
  .stat { font-size: 13px; color: #9aa4b2; margin-top: 8px; word-break: break-all; }
  a.login { color: #79b8ff; }
  /* chat */
  #tabs { display: flex; gap: 8px; margin: 8px 0; overflow-x: auto; }
  #tabs button { white-space: nowrap; padding: 8px 14px; font-size: 14px; }
  #tabs button.sel { background: #1f6feb; }
  #msgs { height: 52vh; overflow-y: auto; background: #0b0e12; border: 1px solid #2a3442; border-radius: 12px; padding: 12px; }
  .m { margin: 8px 0; max-width: 88%; }
  .m .who { font-size: 12px; color: #9aa4b2; margin-bottom: 2px; }
  .m .b { display: inline-block; background: #1f6feb33; border: 1px solid #1f6feb66; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.5; word-break: break-word; }
  .m.mine { margin-left: auto; text-align: right; }
  .m.mine .b { background: #1f6feb; border-color: #1f6feb; color: #fff; text-align: left; }
  .m img, .m video { max-width: 100%; border-radius: 8px; margin-top: 4px; }
  #composer { display: flex; gap: 8px; margin-top: 10px; }
  #txt { flex: 1; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid #2a3442; background: #0b0e12; color: #e8ecf1; }
  .iconbtn { padding: 10px 12px; font-size: 18px; }
  #bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #9aa4b2; margin-bottom: 6px; }
</style>
</head>
<body>

<div class="scr on" id="scr-load">
  <h1>🔌 WASM 게이트웨이</h1>
  <p class="sub">외부 PC에서 1회성으로 가족앱 채팅방에 접속합니다.<br>브라우저 탭이 Tailscale 임시 노드가 됩니다 (탭을 닫으면 노드 소멸).</p>
  <div class="card"><div id="loadstat" class="stat">WASM 모듈 로딩 중…</div></div>
</div>

<div class="scr" id="scr-login">
  <h1>🔑 Tailscale 로그인</h1>
  <p class="sub">아래 버튼을 누르면 테일스케일 로그인 페이지가 새 탭으로 열립니다.<br>로그인하면 이 탭이 테일넷 임시 노드로 입장합니다.</p>
  <div class="card">
    <button id="btn-login">Tailscale 로그인</button>
    <div id="loginstat" class="stat">대기 중</div>
    <div id="loginlink" style="margin-top:8px"></div>
  </div>
</div>

<div class="scr" id="scr-chat" style="max-width:720px">
  <div id="bar"><span id="whoami"></span><span><button class="ghost" id="btn-reload" style="padding:6px 10px;font-size:13px">🔄</button> <button class="ghost" id="btn-logout" style="padding:6px 10px;font-size:13px">로그아웃</button></span></div>
  <div id="tabs"></div>
  <div id="msgs"></div>
  <div id="composer">
    <input id="txt" placeholder="메시지 입력" autocomplete="off">
    <button class="iconbtn ghost" id="btn-photo" title="사진">📷</button>
    <button class="iconbtn ghost" id="btn-video" title="동영상">🎬</button>
    <button id="btn-send">전송</button>
  </div>
  <input type="file" id="file-photo" accept="image/*" multiple style="display:none">
  <input type="file" id="file-video" accept="video/*" style="display:none">
  <div id="chatstat" class="stat"></div>
</div>

<script src="wasm_exec.js"></script>
<script src="app.js"></script>
</body>
</html>
